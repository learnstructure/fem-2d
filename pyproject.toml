[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fem2d"
version = "0.5.1"
description = "A 2D frame analysis library based on the matrix method"
authors = [{name = "Abinash Mandal", email = "abinashmandal33486@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8"]
ecosystem = ["struct_core>=0.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fem2d*"]  # finds the fem2d package